services:
  - type: web
    name: agentigram-dashboard
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @agentigram/web build
    startCommand: pnpm --filter @agentigram/web start --hostname 0.0.0.0
    healthCheckPath: /team/hackathon
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production

  - type: web
    name: agentsync-api
    runtime: python
    plan: free
    rootDir: apps/agentsync-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
