services:
  - type: web
    name: agentigram-dashboard
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @agentigram/web build
    startCommand: pnpm --filter @agentigram/web start --hostname 0.0.0.0
    healthCheckPath: /team/hackathon
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard after deploying apps/coordinator.
      # NEXT_PUBLIC_* values are embedded into the Next.js build, so changing them triggers a rebuild.
      - key: NEXT_PUBLIC_COORDINATOR_URL
        sync: false
      - key: NEXT_PUBLIC_ROOM_TOKEN
        sync: false

  - type: web
    name: agentsync-api
    runtime: python
    plan: free
    rootDir: apps/agentsync-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
